<div class="authveil" id="authVeil"><div class="authbox"><div class="auth-brand"><img src="/icons/icon-192.png?v=financa-facil-aes8-calendar" width="64" height="64" alt="Logo Easy Finance: 8 e AES"><p class="eyebrow">Easy Finance</p></div><h2 id="authHeading">Acesso ao sistema</h2><p id="authMessage">Verificando os perfis disponíveis…</p><form id="authForm" data-onsubmit="event.preventDefault();authSubmit()"><label class="field" id="usernameBox">Usuário<input id="authUsername" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="40" required data-onchange="updateAuthForm()"></label><label class="field"><span id="authPasswordLabel">Sua senha</span><div class="password-row"><input id="authPassword" type="password" autocomplete="current-password" minlength="10" maxlength="128" required aria-describedby="authPasswordHelp"><button class="password-toggle" id="passwordToggle" type="button" aria-pressed="false" data-onclick="toggleAuthPassword()">Mostrar</button></div><small id="authPasswordHelp">Use a senha cadastrada para este perfil.</small></label><label class="field hidden" id="confirmBox">Confirme sua senha<input id="authPasswordConfirm" type="password" autocomplete="new-password" minlength="10" maxlength="128"></label><label class="field hidden" id="setupBox">Código de ativação<input id="setupCode" type="password" autocomplete="off" aria-describedby="setupHelp"><small id="setupHelp">Fornecido pelo responsável pelo sistema. É usado somente para criar o acesso; sua senha será a que você escolher acima.</small></label><button type="button" id="authRegistration" class="btn outline full hidden" data-onclick="toggleRegistration()">Ativar conta inicial</button><button id="authAction" class="btn full" type="submit" disabled>Aguarde…</button><button id="authCancel" class="btn outline full hidden" style="margin-top:8px" type="button" data-onclick="lockApp()">Voltar ao login</button></form><p id="authFeedback" role="status" aria-live="polite">
